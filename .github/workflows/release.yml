name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'YanHaidao/wecom'
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Set up npm Trusted Publishing support
        run: npm install --global npm@12.0.2

      - name: Show release environment
        run: |
          node --version
          npm --version

      - name: Verify tag and package metadata
        run: npm run release:verify -- "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspaces=false

      - name: Run tests
        run: npm test

      - name: Build distribution
        run: npm run build

      - name: Pack the exact release artifact
        id: pack
        run: |
          npm pack --ignore-scripts --json > /tmp/npm-pack.json
          PACKAGE_FILE="$(node --input-type=module -e "import fs from 'node:fs'; const parsed = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8')); const result = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; if (!result?.filename) process.exit(1); process.stdout.write(result.filename);")"
          test -f "$PACKAGE_FILE"
          echo "Packed $PACKAGE_FILE"
          echo "package_file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.package_file }}" --access public

  github-release:
    if: github.repository == 'YanHaidao/wecom'
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "@yanhaidao/wecom $RELEASE_TAG"
          fi
